name: Link Check

on:
  schedule:
    - cron: '0 0 * * 0'  # 每周日运行
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        # requirements-dev.txt 是 runtime + dev 的统一哈希锁，含 aiohttp 等运行依赖；
        # 只维护一份锁文件，避免两份清单漂移。
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Check URL validity
        run: python -m awesome_bioinfo check-links

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔗 Weekly Link Check - Broken Links Detected',
              body: 'The weekly link check found broken links. Please check the [Actions logs](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ') for details.',
              labels: ['automated', 'maintenance', 'broken-links']
            })
