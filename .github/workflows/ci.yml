name: CI

on:
  push:
    branches: [main, master]
    paths: &ci_paths
      - '.github/workflows/ci.yml'
      - 'awesome_bioinfo/**'
      - 'tests/**'
      - 'data/**'
      - 'templates/**'
      - 'README.md'
      - 'pyproject.toml'
  pull_request:
    branches: [main, master]
    paths: *ci_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff format --check awesome_bioinfo/ tests/
      - run: ruff check awesome_bioinfo/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -v --tb=short

  verify:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: CLI smoke checks
        run: |
          python -m awesome_bioinfo validate
          python -m awesome_bioinfo stats
          python -m awesome_bioinfo search smith
          python -m awesome_bioinfo info smith-waterman
          python -m awesome_bioinfo compare smith-waterman needleman-wunsch
          python -m awesome_bioinfo export --format json > /tmp/algorithms.json
          python -m awesome_bioinfo generate
      - name: Verify README is up to date
        run: git diff --exit-code -- README.md
