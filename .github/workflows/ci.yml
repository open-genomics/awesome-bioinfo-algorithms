name: CI

on:
  push:
    branches: [main, master]
    paths: &ci_paths
      - '.github/workflows/ci.yml'
      - 'awesome_bioinfo/**'
      - 'tests/**'
      - 'data/**'
      - 'templates/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'requirements-dev.txt'
  pull_request:
    branches: [main, master]
    paths: *ci_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps
      - run: ruff format --check awesome_bioinfo/ tests/
      - run: ruff check awesome_bioinfo/ tests/

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 已无 ubuntu-24.04/26.04 构建，单独固定到 22.04 运行器。
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps
      - run: python -m pytest tests/ -v --tb=short

  verify:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps
      - name: CLI smoke checks
        run: |
          python -m awesome_bioinfo validate
          python -m awesome_bioinfo stats
          python -m awesome_bioinfo search smith
          python -m awesome_bioinfo info smith-waterman
          python -m awesome_bioinfo compare smith-waterman needleman-wunsch
          python -m awesome_bioinfo export --format json > /tmp/algorithms.json
          python -m awesome_bioinfo generate
      - name: Verify README is up to date
        run: git diff --exit-code -- README.md
