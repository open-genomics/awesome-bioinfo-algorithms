[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awesome-bioinfo-algorithms"
version = "1.0.3"
description = "Repository-maintenance tooling and curated bioinformatics algorithm data"
readme = "README.md"
license = {text = "CC0-1.0"}
requires-python = ">=3.9"
authors = [
    {name = "open-genomics Community"}
]
keywords = ["bioinformatics", "algorithms", "awesome-list", "repository-tooling"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "PyYAML>=6.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
]

[project.urls]
Homepage = "https://github.com/open-genomics/awesome-bioinfo-algorithms"
Repository = "https://github.com/open-genomics/awesome-bioinfo-algorithms"
Issues = "https://github.com/open-genomics/awesome-bioinfo-algorithms/issues"

# This project is maintained and executed from a repository checkout.
# The Python configuration here exists to support local development,
# validation, testing, and README generation for contributors.

[tool.setuptools.packages.find]
where = ["."]
include = ["awesome_bioinfo*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
